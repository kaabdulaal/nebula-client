name: Nebula Production Build
on:
  workflow_dispatch: # Запуск вручную по кнопке в Actions

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-android
            cmd: |
              # Собираем зависимости ядра для Linux
              cd ../nebula_core
              ./vcpkg/vcpkg install --allow-unsupported
              cd ../nebula_client
              flutter build linux --release
              
              # Собираем зависимости для Android
              cd ../nebula_core
              ./vcpkg/vcpkg install --triplet=arm64-android --allow-unsupported
              cd ../nebula_client
              flutter build apk --release --target-platform android-arm64
            artifact_path: |
              nebula_client/build/linux/x64/release/bundle/
              nebula_client/build/app/outputs/flutter-apk/app-release.apk

          - os: windows-latest
            target: windows
            cmd: |
              cd nebula_client
              flutter build windows --release
            artifact_path: nebula_client/build/windows/x64/runner/Release/

    steps:
      # 1. Клонируем Клиент
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      # 2. Клонируем Ядро (через SSH ключ, который ты добавил в Secrets)
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core # ПРОВЕРЬ ПУТЬ!
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      # 3. Бутстрап vcpkg
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          cd nebula_core/vcpkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$(pwd)" >> $GITHUB_ENV

      # 4. Настройка Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Зависимости для Linux и Android сборки
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            m4 autoconf automake libtool nasm

      # 6. Настройка Android SDK (только для Linux-воркера)
      - name: Setup Android SDK
        if: matrix.target == 'linux-android'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      # 7. Сборка
      - name: Execute Build Command
        shell: bash
        run: |
          # Фикс для Git (из-за разных папок)
          git config --global --add safe.directory '*'
          ${{ matrix.cmd }}

      # 8. Загрузка готовых файлов
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
