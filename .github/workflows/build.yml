name: Nebula Production Build
on:
  workflow_dispatch: # Запуск вручную по кнопке в Actions

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-android
            cmd: |
              # 0. Подтягиваем зависимости Flutter (обязательно для плагинов)
              cd $GITHUB_WORKSPACE/nebula_client
              flutter pub get

              # 1. Сборка зависимостей ядра для Linux
              cd $GITHUB_WORKSPACE/nebula_core
              ./vcpkg/vcpkg install --allow-unsupported

              # 2. Упаковка Linux (deb, appimage)
              cd $GITHUB_WORKSPACE/nebula_client
              dart pub global activate flutter_distributor
              export PATH="$PATH":"$HOME/.pub-cache/bin"
              flutter_distributor package --platform linux --targets deb,appimage

              # 3. Сборка Android
              cd $GITHUB_WORKSPACE/nebula_core
              export VCPKG_DEFAULT_TRIPLET=arm64-android
              export VCPKG_DEFAULT_HOST_TRIPLET=x64-linux
              ./vcpkg/vcpkg install --triplet=arm64-android --allow-unsupported

              cd $GITHUB_WORKSPACE/nebula_client
              flutter build apk --release --target-platform android-arm64
            artifact_path: |
              nebula_client/dist/
              nebula_client/build/app/outputs/flutter-apk/app-release.apk

          - os: windows-latest
            target: windows
            cmd: |
              cd $GITHUB_WORKSPACE/nebula_client
              flutter pub get
              flutter build windows --release
            artifact_path: nebula_client/build/windows/x64/runner/Release/

    steps:
      # 1. Клонируем Клиент
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      # 2. Клонируем Ядро (с SSH ключом)
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      # 3. Выкачиваем ВСЕ сабмодули ядра (ИСКЛЮЧАЕТ ОШИБКУ SQLCIPHER И TDLIB)
      - name: Update ALL Submodules
        run: |
          cd nebula_core
          # Сначала берем свежий vcpkg (как было раньше)
          git submodule update --init --remote vcpkg
          # Затем выкачиваем все остальные сабмодули (sqlcipher, tdlib)
          git submodule update --init --recursive

      # 4. Бутстрап vcpkg
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          cd nebula_core/vcpkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$(pwd)" >> $GITHUB_ENV

      # 5. Настройка Java 17 (фикс для Android SDK Manager)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 6. Настройка Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 7. Зависимости для Linux и Android сборки
      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            m4 autoconf automake libtool nasm libfuse2 libsqlcipher-dev

      # 8. Настройка Android SDK
      - name: Setup Android SDK
        if: matrix.target == 'linux-android'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      # 8.5 Восстанавливаем НАСТОЯЩИЙ secrets.h из GitHub Secrets
      - name: Restore real secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          mkdir -p nebula_core/include/nebula/core
          echo "$SECRETS_CONTENT" > nebula_core/include/nebula/core/secrets.h
          echo "Настоящий secrets.h успешно восстановлен!"

      # 9. Сборка (Выполнение cmd из матрицы)
      - name: Execute Build Command
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          ${{ matrix.cmd }}

      # 10. Загрузка готовых файлов (Artifacts)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
