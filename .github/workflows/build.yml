name: Nebula Linux Release Build
on:
  workflow_dispatch:

jobs:
  build_linux:
    name: Build Linux (DEB & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core # ПРОВЕРЬ ПУТЬ!
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      - name: Setup VCPKG
        shell: bash
        run: |
          rm -rf $GITHUB_WORKSPACE/vcpkg
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
          $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev m4 autoconf automake libtool nasm libfuse2 libsqlcipher-dev gperf php

      - name: Restore secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          mkdir -p nebula_core/include/nebula/core
          echo "$SECRETS_CONTENT" > nebula_core/include/nebula/core/secrets.h

      - name: Build TDLib from Source
        shell: bash
        run: |
          echo "Building clean TDLib specifically for Ubuntu 22.04..."
          cd $GITHUB_WORKSPACE/nebula_core
          rm -rf external/tdlib/lib/*
          git clone --depth 1 -b v1.8.0 https://github.com/tdlib/td.git external/tdlib_src
          mkdir -p external/tdlib_src/build && cd external/tdlib_src/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=$GITHUB_WORKSPACE/nebula_core/external/tdlib ..
          # Собираем в 2 потока, чтобы Гитхаб не убил процесс (Займет минут 15-20, ЭТО НОРМАЛЬНО!)
          cmake --build . --target install -j2

      - name: Build Nebula Core
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          cd $GITHUB_WORKSPACE/nebula_core
          $VCPKG_ROOT/vcpkg install --allow-unsupported
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DTDLIB_ROOT=$GITHUB_WORKSPACE/nebula_core/external/tdlib
          # Собираем только ядро, без тестов
          make nebula_core -j$(nproc)

      - name: Build Flutter Linux App
        shell: bash
        run: |
          # Тыкаем Флаттер носом в свежесобранную либу
          export LIBRARY_PATH="$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib:$LD_LIBRARY_PATH"
          export LDFLAGS="-Wl,-rpath-link=$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib"

          cd $GITHUB_WORKSPACE/nebula_client
          flutter pub get
          export CXXFLAGS="-Wno-unknown-warning-option"
          flutter build linux --release

          # Закидываем либу в бандл к бинарнику
          cp $GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/libtdjson.so* build/linux/x64/release/bundle/lib/ || true

      - name: Package DEB & AppImage
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/nebula_client
          
          # --- Упаковка DEB ---
          mkdir -p dist/debian/usr/bin
          mkdir -p dist/debian/DEBIAN
          cp -r build/linux/x64/release/bundle/* dist/debian/usr/bin/
          cat <<EOF > dist/debian/DEBIAN/control
          Package: nebula-client
          Version: 1.0.0
          Architecture: amd64
          Maintainer: nebula-project
          Description: Nebula Desktop Client with Telegram Support
          EOF
          dpkg-deb --build dist/debian nebula-client.deb

          # --- Упаковка AppImage ---
          curl -L https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          mkdir -p dist/AppDir
          cp -r build/linux/x64/release/bundle/* dist/AppDir/

          ln -s nebula_client dist/AppDir/AppRun
          chmod +x dist/AppDir/AppRun
          
          cat <<EOF > dist/AppDir/nebula.desktop
          [Desktop Entry]
          Name=Nebula
          Exec=nebula_client
          Icon=nebula
          Type=Application
          Categories=Utility;
          EOF
          touch dist/AppDir/nebula.png
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run dist/AppDir nebula-client.AppImage || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-linux-release
          path: |
            nebula_client/*.deb
            nebula_client/*.AppImage
