name: Nebula Production Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-android
            cmd: |
              # 0. Flutter pub get
              cd $GITHUB_WORKSPACE/nebula_client
              flutter pub get

              # 1. Сборка зависимостей ядра (VCPKG)
              cd $GITHUB_WORKSPACE/nebula_core
              $VCPKG_ROOT/vcpkg install --allow-unsupported

              # 2. Сборка самого ядра (теперь все файлы в main!)
              mkdir -p build && cd build
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release
              make -j$(nproc)

              # 3. Упаковка Linux (deb, appimage)
              cd $GITHUB_WORKSPACE/nebula_client
              dart pub global activate flutter_distributor
              export PATH="$PATH":"$HOME/.pub-cache/bin"
              flutter_distributor package --platform linux --targets deb,appimage

              # 4. Сборка Android (APK)
              cd $GITHUB_WORKSPACE/nebula_core
              export VCPKG_DEFAULT_TRIPLET=arm64-android
              export VCPKG_DEFAULT_HOST_TRIPLET=x64-linux
              $VCPKG_ROOT/vcpkg install --triplet=arm64-android --allow-unsupported

              cd $GITHUB_WORKSPACE/nebula_client
              flutter build apk --release --target-platform android-arm64
            artifact_path: |
              nebula_client/dist/
              nebula_client/build/app/outputs/flutter-apk/app-release.apk

          - os: windows-latest
            target: windows
            cmd: |
              cd $GITHUB_WORKSPACE/nebula_client
              flutter pub get
              flutter build windows --release
            artifact_path: nebula_client/build/windows/x64/runner/Release/

    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      # Клонируем vcpkg в корень (чтобы избежать конфликтов с сабмодулями внутри ядра)
      - name: Setup VCPKG
        shell: bash
        run: |
          rm -rf $GITHUB_WORKSPACE/vcpkg
          git clone https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
          cd $GITHUB_WORKSPACE/vcpkg
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            m4 autoconf automake libtool nasm libfuse2 libsqlcipher-dev

      - name: Install Android NDK
        if: matrix.target == 'linux-android'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Restore secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          mkdir -p nebula_core/include/nebula/core
          echo "$SECRETS_CONTENT" > nebula_core/include/nebula/core/secrets.h

      - name: Execute Build Command
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          ${{ matrix.cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
