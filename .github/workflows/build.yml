name: Nebula Linux Release Build
on:
  workflow_dispatch:

jobs:
  build_linux:
    name: Build Linux (DEB & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core # ПРОВЕРЬ ПУТЬ!
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      - name: Cache VCPKG
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            !${{ github.workspace }}/vcpkg/.git
            ${{ github.workspace }}/nebula_core/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('nebula_core/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup VCPKG
        shell: bash
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/vcpkg/vcpkg" ]; then
            echo "Cache MISS or stale — cloning vcpkg (full history for baseline resolution)..."
            rm -rf $GITHUB_WORKSPACE/vcpkg
            git clone https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
            $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh
          else
            echo "✅ vcpkg restored from cache"
          fi
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev m4 autoconf automake libtool nasm libfuse2 libsqlcipher-dev gperf php

      - name: Restore secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          SECRETS_PATH="$GITHUB_WORKSPACE/nebula_core/include/nebula/core/secrets.h"
          mkdir -p "$(dirname "$SECRETS_PATH")"
          echo "$SECRETS_CONTENT" > "$SECRETS_PATH"

          echo "--- DEBUG: Verify secrets.h was written ---"
          ls -la "$SECRETS_PATH"
          echo "--- Content structure check (no values leaked) ---"
          grep -c "NEBULA_API_ID" "$SECRETS_PATH"   && echo "✅ NEBULA_API_ID present"   || { echo "❌ NEBULA_API_ID MISSING"; exit 1; }
          grep -c "NEBULA_API_HASH" "$SECRETS_PATH"  && echo "✅ NEBULA_API_HASH present"  || { echo "❌ NEBULA_API_HASH MISSING"; exit 1; }
          grep -c "NEBULA_GIST_URL" "$SECRETS_PATH"  && echo "✅ NEBULA_GIST_URL present"  || { echo "❌ NEBULA_GIST_URL MISSING"; exit 1; }
          grep -c "NEBULA_XOR_KEY" "$SECRETS_PATH"   && echo "✅ NEBULA_XOR_KEY present"   || { echo "❌ NEBULA_XOR_KEY MISSING"; exit 1; }

      - name: Cache TDLib
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: nebula_core/external/tdlib
          key: tdlib-v1.8.0-ubuntu-22.04

      - name: Build TDLib from Source
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Cache MISS — building TDLib from source (this takes ~20 min)..."
          cd $GITHUB_WORKSPACE/nebula_core
          rm -rf external/tdlib/lib/*
          git clone --depth 1 -b v1.8.0 https://github.com/tdlib/td.git external/tdlib_src
          mkdir -p external/tdlib_src/build && cd external/tdlib_src/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=$GITHUB_WORKSPACE/nebula_core/external/tdlib ..
          cmake --build . --target install -j2
          echo "TDLib build complete. Cleaning up source to save cache space..."
          rm -rf $GITHUB_WORKSPACE/nebula_core/external/tdlib_src

      - name: Verify TDLib
        shell: bash
        run: |
          echo "--- TDLib installation check ---"
          ls -la $GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/libtdjson.so* \
            && echo "✅ TDLib ready ($(steps.cache-tdlib.outputs.cache-hit == 'true' && echo 'from cache' || echo 'freshly built'))" \
            || { echo "❌ FATAL: libtdjson.so missing"; exit 1; }

      # NOTE: Standalone "Build Nebula Core" step intentionally REMOVED.
      # nebula_core is an ffiPlugin — its linux/CMakeLists.txt contains
      # add_subdirectory("..") which causes `flutter build linux` to rebuild
      # the entire C++ core from source. The standalone build's output .so
      # was overwritten by Flutter's plugin system and NEVER used.
      # We only pre-install vcpkg deps so they're ready for Flutter's CMake.

      - name: Pre-install VCPKG dependencies
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          cd $GITHUB_WORKSPACE/nebula_core

          # Try manifest-based install first; fall back to explicit packages
          if ! $VCPKG_ROOT/vcpkg install --allow-unsupported 2>&1; then
            echo "⚠️ Manifest install failed. Falling back to explicit packages..."
            $VCPKG_ROOT/vcpkg install jsoncpp openssl --allow-unsupported
          fi

      - name: Verify VCPKG dependencies
        shell: bash
        run: |
          echo "=== VCPKG installed packages ==="
          $VCPKG_ROOT/vcpkg list
          echo ""
          echo "=== Checking critical libs ==="
          find $GITHUB_WORKSPACE/nebula_core/vcpkg_installed -name "libjsoncpp*" 2>/dev/null | head -3
          find $GITHUB_WORKSPACE/nebula_core/vcpkg_installed -name "libssl*" -o -name "libcrypto*" 2>/dev/null | head -3
          echo "✅ VCPKG verification complete"

      - name: Verify build inputs
        shell: bash
        run: |
          echo "=== 1. secrets.h (absolute path) ==="
          ls -la "$GITHUB_WORKSPACE/nebula_core/include/nebula/core/secrets.h"

          echo ""
          echo "=== 2. TDLib installation ==="
          ls -la "$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/" | head -10

          echo ""
          echo "=== 3. Flutter plugin symlink ==="
          cd $GITHUB_WORKSPACE/nebula_client
          flutter pub get
          SYMLINK="linux/flutter/ephemeral/.plugin_symlinks/nebula_core"
          ls -la "$SYMLINK"

          echo ""
          echo "=== 4. secrets.h reachable VIA symlink ==="
          ls -la "$SYMLINK/include/nebula/core/secrets.h" \
            && echo "✅ secrets.h visible through plugin symlink" \
            || { echo "❌ FATAL: secrets.h NOT visible through symlink"; exit 1; }

          echo ""
          echo "=== 5. VCPKG_ROOT ==="
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          ls "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            && echo "✅ Toolchain file exists" \
            || echo "❌ Toolchain file missing"

      - name: Build Flutter Linux App
        shell: bash
        run: |
          export LIBRARY_PATH="$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib:$LD_LIBRARY_PATH"
          export LDFLAGS="-Wl,-rpath-link=$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib"

          cd $GITHUB_WORKSPACE/nebula_client
          export CXXFLAGS="-Wno-unknown-warning-option"
          flutter build linux --release \
            --dart-define=NEBULA_FACTORY_CARTRIDGE="${{ secrets.FACTORY_CARTRIDGE }}"

          echo "=== POST-BUILD: Verify bundle contents ==="
          echo "--- libnebula_core.so ---"
          ls -la build/linux/x64/release/bundle/lib/libnebula_core.so

          echo "--- libtdjson.so ---"
          ls -la build/linux/x64/release/bundle/lib/libtdjson.so* || echo "WARNING: libtdjson.so NOT in bundle"

          echo "--- All libs ---"
          ls -la build/linux/x64/release/bundle/lib/

          # Backup: копируем TDLib в бандл (на случай, если Flutter не скопировал)
          cp $GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/libtdjson.so* build/linux/x64/release/bundle/lib/ || true

      - name: Package DEB & AppImage
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/nebula_client
          
          # --- Упаковка DEB ---
          mkdir -p dist/debian/usr/bin
          mkdir -p dist/debian/DEBIAN
          cp -r build/linux/x64/release/bundle/* dist/debian/usr/bin/
          cat <<EOF > dist/debian/DEBIAN/control
          Package: nebula-client
          Version: 1.0.0
          Architecture: amd64
          Maintainer: nebula-project
          Description: Nebula Desktop Client with Telegram Support
          EOF
          dpkg-deb --build dist/debian nebula-client.deb

          # --- Упаковка AppImage ---
          curl -L https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          mkdir -p dist/AppDir
          cp -r build/linux/x64/release/bundle/* dist/AppDir/

          ln -s nebula_client dist/AppDir/AppRun
          chmod +x dist/AppDir/AppRun
          
          cat <<EOF > dist/AppDir/nebula.desktop
          [Desktop Entry]
          Name=Nebula
          Exec=nebula_client
          Icon=nebula
          Type=Application
          Categories=Utility;
          EOF
          touch dist/AppDir/nebula.png
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run dist/AppDir nebula-client.AppImage || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-linux-release
          path: |
            nebula_client/*.deb
            nebula_client/*.AppImage
