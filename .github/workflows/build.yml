name: Nebula Production Build
on:
  workflow_dispatch:

jobs:
  build_linux_android:
    name: Build Linux & Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      - name: Setup VCPKG
        shell: bash
        run: |
          rm -rf $GITHUB_WORKSPACE/vcpkg
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
          $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Hack VCPKG for Android API 21
        shell: bash
        run: |
          cat <<EOF > $GITHUB_WORKSPACE/vcpkg/triplets/arm64-android.cmake
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Android)
          set(ANDROID_PLATFORM android-21)
          EOF

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev m4 autoconf automake libtool nasm libfuse2 libsqlcipher-dev

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Restore secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          mkdir -p nebula_core/include/nebula/core
          echo "$SECRETS_CONTENT" > nebula_core/include/nebula/core/secrets.h

      - name: Execute Full Build (Linux & Android)
        shell: bash
        run: |
          git config --global --add safe.directory '*'

          # --- 1. Сборка ядра Linux ---
          cd $GITHUB_WORKSPACE/nebula_core
          $VCPKG_ROOT/vcpkg install --allow-unsupported
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DTDLIB_ROOT=$GITHUB_WORKSPACE/nebula_core/external/tdlib

          # Собираем ТОЛЬКО ядро, игнорируя тесты!
          make nebula_core -j$(nproc)

          # --- ФИКС ЛИНКОВЩИКА FLUTTER ---
          # Линковщик ищет версию 1.8.61. Создаем копию файла специально для него!
          cd $GITHUB_WORKSPACE/nebula_core/external/tdlib/lib
          cp libtdjson.so libtdjson.so.1.8.61 || true
          
          # Запихиваем путь к библиотеке в глотку компилятору и линковщику
          export LIBRARY_PATH="$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib:$LIBRARY_PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib:$LD_LIBRARY_PATH"
          export LDFLAGS="-Wl,-rpath-link=$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib"

          # --- 2. Сборка Flutter Linux ---
          cd $GITHUB_WORKSPACE/nebula_client
          flutter pub get
          export CXXFLAGS="-Wno-unknown-warning-option"
          flutter build linux --release

          # Копируем ВСЕ версии либы телеги в финальный бандл
          cp $GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/libtdjson.so* build/linux/x64/release/bundle/lib/ || true

          # --- 3. Упаковка DEB и AppImage ---
          mkdir -p dist/debian/usr/bin
          mkdir -p dist/debian/DEBIAN
          cp -r build/linux/x64/release/bundle/* dist/debian/usr/bin/
          cat <<EOF > dist/debian/DEBIAN/control
          Package: nebula-client
          Version: 1.0.0
          Architecture: amd64
          Maintainer: nebula-project
          Description: Nebula Desktop Client with Telegram Support
          EOF
          dpkg-deb --build dist/debian nebula-client.deb

          curl -L https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          mkdir -p dist/AppDir
          cp -r build/linux/x64/release/bundle/* dist/AppDir/
          cat <<EOF > dist/AppDir/nebula.desktop
          [Desktop Entry]
          Name=Nebula
          Exec=nebula_client
          Icon=nebula
          Type=Application
          Categories=Utility;
          EOF
          touch dist/AppDir/nebula.png
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run dist/AppDir nebula-client.AppImage || true

          # --- 4. Сборка Android ---
          cd $GITHUB_WORKSPACE/nebula_core
          export VCPKG_DEFAULT_TRIPLET=arm64-android
          # Используем no-binarycaching чтобы пересобрать OpenSSL под API 21 и избежать ошибки __write_chk
          $VCPKG_ROOT/vcpkg install --triplet=arm64-android --allow-unsupported --no-binarycaching

          cd $GITHUB_WORKSPACE/nebula_client
          flutter build apk --release --target-platform android-arm64

      - name: Upload Linux & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-linux-android
          path: |
            nebula_client/*.deb
            nebula_client/*.AppImage
            nebula_client/build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      - name: Restore secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          mkdir -p nebula_core/include/nebula/core
          echo "$SECRETS_CONTENT" > nebula_core/include/nebula/core/secrets.h

      - name: Setup VCPKG
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
          $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Core (Windows)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/nebula_core
          $VCPKG_ROOT/vcpkg install --triplet=x64-windows
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DTDLIB_ROOT="$GITHUB_WORKSPACE/nebula_core/external/tdlib"
          
          # Собираем только ядро, чтобы не упало на тестах, как в Linux
          cmake --build . --config Release --target nebula_core

      - name: Build Flutter (Windows)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/nebula_client
          flutter pub get
          flutter build windows --release

      - name: Copy TDLib (Windows)
        shell: bash
        run: |
          # Копируем DLL телеги в папку с собранным EXEшником
          if [ -f "$GITHUB_WORKSPACE/nebula_core/external/tdlib/bin/libtdjson.dll" ]; then
            cp "$GITHUB_WORKSPACE/nebula_core/external/tdlib/bin/libtdjson.dll" $GITHUB_WORKSPACE/nebula_client/build/windows/x64/runner/Release/ || true
          fi
          if [ -f "$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/libtdjson.dll" ]; then
            cp "$GITHUB_WORKSPACE/nebula_core/external/tdlib/lib/libtdjson.dll" $GITHUB_WORKSPACE/nebula_client/build/windows/x64/runner/Release/ || true
          fi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-windows
          path: nebula_client/build/windows/x64/runner/Release/
