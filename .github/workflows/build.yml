name: Nebula Production Build
on:
  workflow_dispatch: # Запуск вручную по кнопке в Actions

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-android
            cmd: |
              # 1. Собираем зависимости ядра
              cd ../nebula_core
              ./vcpkg/vcpkg install --allow-unsupported
              
              # 2. Настраиваем дистрибьютор для deb и appimage
              cd ../nebula_client
              dart pub global activate flutter_distributor
              export PATH="$PATH":"$HOME/.pub-cache/bin"
              
              # 3. Собираем пакеты Linux (deb, appimage)
              flutter_distributor package --platform linux --targets deb,appimage
              
              # 4. Собираем Android (зависимости + apk)
              cd ../nebula_core
              export VCPKG_DEFAULT_TRIPLET=arm64-android
              export VCPKG_DEFAULT_HOST_TRIPLET=x64-linux
              ./vcpkg/vcpkg install --triplet=arm64-android --allow-unsupported
              cd ../nebula_client
              flutter build apk --release --target-platform android-arm64 --no-pub
            artifact_path: |
              nebula_client/dist/
              nebula_client/build/app/outputs/flutter-apk/app-release.apk

          - os: windows-latest
            target: windows
            cmd: |
              cd nebula_client
              flutter build windows --release --no-pub
            artifact_path: nebula_client/build/windows/x64/runner/Release/

    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      - name: Update vcpkg Submodule Manually
        run: |
          cd nebula_core
          git submodule update --init --recursive --remote vcpkg

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          cd nebula_core/vcpkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$(pwd)" >> $GITHUB_ENV

      - name: Setup Java JDK 17
        if: matrix.target == 'linux-android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            m4 autoconf automake libtool nasm libfuse2 # libfuse2 нужен для AppImage

      - name: Setup Android SDK
        if: matrix.target == 'linux-android'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      - name: Execute Build Command
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          ${{ matrix.cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
