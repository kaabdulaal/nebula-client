name: Nebula Production Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-android
            cmd: |
              # 0. Flutter pub get
              cd $GITHUB_WORKSPACE/nebula_client
              flutter pub get
              
              # 1. Сборка ядра для Linux
              cd $GITHUB_WORKSPACE/nebula_core
              ./vcpkg/vcpkg install --allow-unsupported
              
              # 2. Сборка Linux пакетов
              cd $GITHUB_WORKSPACE/nebula_client
              dart pub global activate flutter_distributor
              export PATH="$PATH":"$HOME/.pub-cache/bin"
              flutter_distributor package --platform linux --targets deb,appimage
              
              # 3. Сборка Android (APK)
              cd $GITHUB_WORKSPACE/nebula_core
              export VCPKG_DEFAULT_TRIPLET=arm64-android
              export VCPKG_DEFAULT_HOST_TRIPLET=x64-linux
              ./vcpkg/vcpkg install --triplet=arm64-android --allow-unsupported
              
              cd $GITHUB_WORKSPACE/nebula_client
              flutter build apk --release --target-platform android-arm64
            artifact_path: |
              nebula_client/dist/
              nebula_client/build/app/outputs/flutter-apk/app-release.apk

          - os: windows-latest
            target: windows
            cmd: |
              cd $GITHUB_WORKSPACE/nebula_client
              flutter pub get
              flutter build windows --release
            artifact_path: nebula_client/build/windows/x64/runner/Release/

    steps:
      - name: Checkout Client
        uses: actions/checkout@v4
        with:
          path: nebula_client

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: kaabdulaal/nebula-core
          path: nebula_core
          ssh-key: ${{ secrets.SSH_KEY_CORE }}

      # ШАГ 3: ЖЕСТКИЙ ФИКС САБМОДУЛЕЙ (МЫ ИХ ПРОСТО КЛОНИРУЕМ)
      - name: Force Clone Dependencies
        shell: bash
        run: |
          cd nebula_core
          # Чистим забагованные сабмодули
          rm -rf vcpkg external/sqlcipher
          
          # Качаем vcpkg напрямую (свежий мастер)
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          
          # Качаем sqlcipher напрямую (чтобы CMake увидел sqlite3.c)
          mkdir -p external/sqlcipher
          git clone --depth 1 https://github.com/sqlcipher/sqlcipher.git external/sqlcipher
          
          echo "Dependencies cloned manually. Submodule hell bypassed."

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          cd nebula_core/vcpkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
          echo "VCPKG_ROOT=$(pwd)" >> $GITHUB_ENV

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            m4 autoconf automake libtool nasm libfuse2 libsqlcipher-dev

      - name: Setup Android SDK
        if: matrix.target == 'linux-android'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      - name: Restore real secrets.h
        shell: bash
        env:
          SECRETS_CONTENT: ${{ secrets.REAL_SECRETS_H }}
        run: |
          mkdir -p nebula_core/include/nebula/core
          echo "$SECRETS_CONTENT" > nebula_core/include/nebula/core/secrets.h
          echo "Secrets restored."

      - name: Execute Build Command
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          ${{ matrix.cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
